# Base configuration. Per-environment files override these.
# REQ-N-09: no threshold, weight, interval or assumption lives in code.
# REQ-N-10: every change here is logged with timestamp and rationale.

version: 1
environment: local

opensea:
  stream_url: "wss://stream.openseabeta.com/socket/websocket"
  rest_base: "https://api.opensea.io/api/v2"
  heartbeat_seconds: 30
  max_backoff_seconds: 60

rest_budget:
  # MEASURED 2026-09-09 from live response headers (BUG-20260909-003):
  #   x-ratelimit-limit: 120     <-- not the 600 previously documented
  # The 600 figure was an assumption that survived into every document
  # unchallenged. One real request falsified it.
  #
  # Caveat: that response was a Cloudflare cache HIT, so the headers may be a
  # cached reading rather than live. 120 is used as the conservative default.
  # The governor reads x-ratelimit-limit on every response and adapts
  # (TokenBucket.observe_headers, governor.py -- BUG-20260909-029: this line
  # claimed that for a day before any code did it; a test now holds the code
  # to it), so a wrong default self-corrects on the first uncached reply, and
  # BudgetState.capacity_source records whether config or the server is in
  # force.
  capacity: 120
  per_seconds: 3600
  # Floors keep low-priority work from consuming the last of the budget, so an
  # INTERACTIVE request arriving later still finds something left.
  # Floors rescaled to the measured 120/hr budget (were 0/20/60/120 at 600).
  reserve:
    INTERACTIVE: 0
    SIGNAL: 4
    BACKFILL: 12
    MAINTENANCE: 24

stream:
  # PR-10. A SECOND, redundant stream connection. DEFAULT OFF, and off means
  # nothing about this system changes: one process, one landing root, one lock
  # file, byte-identical landing output.
  #
  # What it buys: the reconnect window of one connection, covered by the other.
  # 1-3 s per clean drop and 21-45 s per silent half-open one -- ~1,900 events at
  # the measured Argonauts rate, about half of them cancellations that no REST
  # call can ever fetch back (REQ-D-09a).
  #
  # What it costs, stated first: disk DOUBLES (~660 MB/day -> ~1.3 GB/day for one
  # collection), and every raw count over `events` and `order_criteria` doubles
  # with it. `order_lives` resolves the duplicates; a raw count over `events`
  # does not, which is why /api/health carries a `dedup` block.
  #
  # What it does NOT buy: anything against a server outage, a sleeping laptop,
  # or a key expiry. On one laptop the correlated failures dominate.
  redundant:
    enabled: false
    # Connection B's OWN key, in .env. NEVER the same key as A's: free instant
    # keys expire after 7 days (REQ-D-06), so two processes on one key fail in
    # the same minute on a known schedule (E-V13) -- which is precisely the
    # moment redundancy was bought for. B refuses to start if this is missing or
    # equal to OPENSEA_API_KEY. Create the two keys on different days.
    key_env: "OPENSEA_API_KEY_2"
    # Its own landing root and its own lock: one writer per store, two stores.
    # Two writers on ONE root lose manifest records silently -- measured at 295
    # of 600 gap records, with the integrity audit reporting clean.
    landing_root: "data/landing-b"
    lock_file: "data/landing-b/.ingest.lock"
    label: "b"
    monitor:
      # The duplicate-fraction monitor (dataeng failure mode 3, the S0 one).
      # Under a healthy pair MOST events are seen twice, so duplicates
      # COLLAPSING toward zero means the dedup key has gone too wide -- every
      # count and every rate doubles and the backtest looks wonderful. Alarm,
      # do not celebrate.
      window_seconds: 900
      # Below this many keyable events in the window a connection is not
      # "healthy" and the monitor does not evaluate: zero duplicates with a dead
      # B is the CORRECT observation, and alarming on it would fire through
      # every restart and train the Operator to ignore the real one.
      min_events: 100
      # Warn below this observed duplicate fraction. 0.5 is a judgement, not a
      # measurement -- see config/assumptions.yaml ASM-030.
      collapse_fraction: 0.5
      # How many MULTIPLICITY DISAGREEMENTS in the window are tolerated before
      # the monitor warns. A disagreement is a dedup key both connections saw,
      # a DIFFERENT number of times -- which is what a rejoin-replay looks like,
      # and also what a dropped genuine repeat looks like. Dedup keeps one row
      # and cannot tell them apart, so each one is a place the count may be an
      # undercount. 0 means any disagreement warns. Raise it from measurement,
      # not from irritation: see ASM-030, which records that no two-connection
      # capture exists yet and that this number is therefore unmeasured.
      multiplicity_disagreement_max: 0

landing:
  root: "data/landing"
  codec: zstd            # gzip is a deliberate fallback, never a silent one
  codec_level: 9
  roll_bytes: 67108864   # 64 MiB uncompressed
  # REQ-D-26a: frame flush cadence. This is what makes the crash-safety
  # property real rather than decorative -- it bounds loss to seconds.
  flush_seconds: 5
  flush_events: 1000

opstore:
  path: "data/ops.db"

analytical:
  # SQLite for Phase 0. docs/07 specifies DuckDB; the substitution is deliberate
  # and recorded in docs/08 §5 -- the environment this was built in cannot
  # install DuckDB, and an untested analytical store is how BUG-010 happened.
  # Every query is plain SQL DuckDB also accepts; the swap is this one line.
  path: "data/analytics.sqlite"

traits:
  # Argonauts: every token's metadata_url is NULL on OpenSea, so the direct
  # path yields nothing and the only zero-read source is the Explorer cache
  # (co-authored with the Operator's friend). import-traits.command reads it
  # from here. Relative to the project root; keyed by token id; traits verbatim.
  explorer_cache_path: "../GitHub/argonauts-explorer/data/tokens.json"
  # Token metadata is fetched from each token's own metadata_url -- not from
  # OpenSea, so it costs no REST budget. ipfs:// URLs go through this gateway.
  ipfs_gateway: "https://ipfs.io/ipfs/"
  concurrency: 6
  timeout_seconds: 20
  # When a token's metadata cannot be fetched, OpenSea's per-token endpoint is
  # tried instead -- but at most this many times per run, because that one IS
  # metered and 9,212 of them would be 77 hours of budget.
  opensea_fallback_budget: 50

dashboard:
  host: "127.0.0.1"      # REQ-N-13: loopback only. The server REFUSES anything else.
  port: 8765
  refresh_seconds: 5     # how often the normalizer folds new frames into the store

reconciliation:
  # REQ-D-10 + 07 §3.3: rotate, do not sweep. Checking every collection hourly
  # would cost a third of the budget permanently; daily rotation costs ~1.4%.
  rotation_hours: 24
  drift_alert_threshold_pct: 2.0

display:
  timezone: "America/Chicago"   # storage is always UTC; this is display only
