# The assumptions registry (docs/06 §4.4). Every judgment the code embodies is
# listed here with its rationale and owner, so the Operator can audit the
# system's opinions by reading one file. This is configuration: a change is a
# branch and a merge through the normal gate (docs/04 §5), never an edit in place.
#
# The entries below are DEFINITIONS in the derivation layer rather than tuned
# numbers -- they are here because two reasonable people could disagree about
# them (docs/06 §4.1), which is the test for "assumption".

version: 1

assumptions:
  - id: ASM-020
    name: standing_order_definition
    layer: derivation
    decided: 2026-09-09
    decided_by: Spencer (Operator), via the trait-book brief; implemented by data-engineer
    owner: data-engineer
    review: 2026-12-01
    code: src/navanax/metrics.py::standing_sql
    value:
      unexpired: "expiration_ts IS NULL OR expiration_ts > as_of"
      null_expiration: standing            # an order with no expiry never expires on its own
      item_sold: final                     # a later order_revalidate does NOT reopen it
      item_cancelled: final                # on-chain Seaport cancel; a later revalidate does NOT reopen it
      order_invalidate: reopenable         # dead unless an order_revalidate for the same hash follows
      revalidate_same_instant: reopens     # invalidate and revalidate at the SAME valid_ts -> standing (>= comparison)
      revalidate_before_invalidate: no_effect
    rationale: >
      OpenSea emits order_invalidate / order_revalidate as the maker's balance
      or approval comes and goes; a revalidated order is real, fillable
      liquidity, so treating every invalidation as final (the behaviour before
      2026-09-09) hid standing orders. Cancels and sales are terminal on
      chain. NULL expiry is read as "never" because that is what a Seaport
      endTime of max-uint means; the cost of being wrong is a stale ask on
      screen, not a wrong trade. Same-instant revalidate is a tie-break with
      no observed instance yet; it was chosen to keep the predicate a single
      >= comparison and is listed so it can be revisited when one appears.
    applies_to: [live_book, screener, trait_book]

  - id: ASM-021
    name: standing_book_series_and_crossed_book_rule
    layer: derivation
    decided: 2026-09-10
    decided_by: Spencer (Operator) for the book choice; data-engineer for the reporting rules, under tech-lead PR-3
    owner: data-engineer
    review: 2026-12-01
    code: src/navanax/metrics.py::standing_series, src/navanax/metrics.py::standing_spread
    value:
      default_book: standing              # floor_ask, collection_bid, immediacy_cost
      observed_book: reachable_and_labelled   # book='observed'; never the default
      no_standing_ask: "null"              # a bucket with no live ask is a hole, not 0 and not the last price
      bucket_statistic: time_weighted_median   # not the interval extremum, not the last sample
      sampling: every_event_time_in_the_bucket # sweep line, not bucket boundaries
      immediacy_bid_leg: collection_offer_only # leg discipline: it applies to every token, so it is the bid on the floor token
      crossed_book: "null + counted + logged"  # ask < bid at ANY tau nulls the WHOLE bucket
      median_below_min_n: reported         # it is the level of a step function, a fact at n = 1
      band_below_min_n: withheld           # [p10, p90] is a distributional claim; REQ-F-19
      min_n_for_percentiles: 30
    rationale: >
      docs/01 §3.2 defines immediacy_cost on the STANDING book; the interval
      extremum that shipped before 2026-09-10 was a different quantity, biased
      narrow and able to go negative (BUG-20260910-057). Two reasonable people
      could still disagree about three of the rules above, which is why they are
      here rather than only in code. (1) Nulling the WHOLE bucket on a single
      crossed sample is deliberately blunt: a crossed book means the
      reconstruction is wrong, and the median of the uncrossed remainder would
      hide it behind a plausible number. (2) Reporting the time-weighted median
      below the percentile minimum while withholding the band treats the two as
      different objects -- a level that was observed continuously versus a claim
      about its distribution -- and the alternative (withhold both) would blank
      the chart wherever the book is genuinely one listing deep, which on this
      collection is most of it. (3) The bid leg is collection offers only; a
      union over item bids and trait offers is a different metric and is not
      substituted here.
    applies_to: [floor_ask, collection_bid, immediacy_cost, market_kpi]

  - id: ASM-022
    name: survival_episode_clustering_and_bootstrap
    layer: analysis
    decided: 2026-09-10
    decided_by: quant-research under tech-lead PR-8; epsilon and B are the quant's, unreviewed by the Operator
    owner: quant-research
    review: 2026-10-15
    code: src/navanax/metrics.py::episode_ids, src/navanax/metrics.py::cluster_bootstrap, src/navanax/metrics.py::survival
    value:
      episode_gap_seconds: 60.0          # epsilon: same maker + same scope, quotes < eps apart = ONE episode
      episode_scope: [scope_kind, token_id]   # a bot working two tokens is two episodes
      no_maker: one_shared_cluster       # a life with no maker joins ONE cluster, never its own
      bootstrap_b: 1000                  # replicates; the band is 2.5/97.5 of the replicate distribution
      bootstrap_seed: 20260910           # deterministic: the band on the page is the band in the test
      bootstrap_work_cap: 2000000        # B x n resampled observations before B is cut, and the cut is REPORTED
      bootstrap_unit: maker_episode      # never the order: an order-level bootstrap is ~sqrt(n/n_eff) too narrow
      min_clusters_for_survival_percentiles: 30
      band_on_screen: cluster_bootstrap  # Greenwood travels as a diagnostic and is never the drawn band
      censoring: administrative_at_as_of # exit_reason is stored as of the FOLD and re-read against as_of
      unknown_terminator: excluded_and_counted
      rmst_beyond_data: refused          # tau* past the largest observed duration returns null, never a flat tail
    rationale: >
      Every number here is a judgement, and epsilon is the weakest of them.
      (1) EPSILON = 60 s has not been measured. The only evidence we have is a
      40-minute window in which the median bid life was ~9 s, so a maker that is
      actively quoting requotes well inside a minute and a full-minute gap on one
      scope reads as a stop and a restart. The honest statement is that the
      inter-quote gap DISTRIBUTION has never been plotted; when it is, this
      number should be re-derived from the trough between the requote mode and
      the session mode, and until then n_eff carries whatever error epsilon has.
      Too small an epsilon splits one bot into many clusters and narrows the band
      -- the flattering direction -- which is why the review date is short.
      (2) B = 1000 is the conventional replicate count for a percentile
      bootstrap; the work cap exists because 42,601 lives x 1000 replicates is
      4e7 resampled observations inside a 10-second dashboard refresh, and a cut
      that is not reported is a band that quietly means something else.
      (3) The bootstrap resamples MAKER-EPISODES rather than orders because
      orders inside one bot episode are not independent; the quant estimates an
      order-level band would be ~sqrt(n / n_eff) -- about 15x on this data -- too
      narrow (quant §3.2, factcheck D-W5). Greenwood assumes the same
      independence and is kept only as a diagnostic.
      (4) THIRTY CLUSTERS, not thirty orders, is the binding minimum: percentiles
      from many observations of few independent agents are precise about the
      agents and silent about the market (quant §3.3). At the maker level this
      collection currently has n_eff = 3, possibly 1 if the three makers are one
      entity, so the panel will be in strip mode on real data and that is the
      correct answer, not a failure.
      (5) A life whose maker we do not know joins ONE shared cluster instead of
      its own. Both choices are defensible; this one widens the band, and
      widening is the direction that cannot manufacture an edge.
    applies_to: [survival, survival_drill, bid_lifetime_panel]

  - id: ASM-030
    name: redundant_stream_dedup_key
    layer: derivation
    decided: 2026-09-11
    decided_by: tech-lead (TECHLEAD_2026-09-09_factcheck E-W3/E-U3/E-W4, PR-10); implemented by data-engineer
    owner: data-engineer
    review: 2026-12-01
    code: src/navanax/normalize.py::dedup_key, src/navanax/normalize.py::_dedupe_life_rows
    value:
      key_fields: [event_type, order_hash, event_timestamp, tx_hash, contract,
                   token_id, maker, price_wei, quantity]
      separator: "0x1F"                    # no field value can contain it, so none can forge a boundary
      excluded_fields: [observed_at, _recv, _seq, run, sent_at]
      timestamp_field: event_timestamp     # NEVER the coalesced valid_at
      no_event_timestamp: undedupable      # kept, counted, never merged
      multiplicity: one_row_per_key        # NOT max-over-connections: that doubled on a B replay
      # The superseded rule and the bug that retired it, as DATA rather than as a
      # comment: a reader loading this file gets the history, not just the answer.
      multiplicity_superseded: max_over_connections
      multiplicity_changed_by: BUG-20260911-073
      coverage_changed_by: BUG-20260911-074
      discarded_multiplicity: counted      # order_lives.deliveries_a / deliveries_b / multiplicity_disagreements
      monitor_multiplicity_disagreement_max: 0
      coverage_rule: manifest_intervals_minus_own_gaps   # BUG-20260911-074
      coverage_extent: whole_gap_only      # a partly covered gap gets no annotation
      coverage_revocable: true             # cleared when the evidence stops supporting it
      coverage_revocable_changed_by: BUG-20260911-077
      lives_method_refold_on_open: writer_only   # a reader reports; it never re-folds
      lives_method_changed_by: BUG-20260911-076
      resolved_in: order_lives             # materialised; never a view (INDEXED BY, BUG-20260909-040)
      events_table: keeps_both_rows        # a fold of two append-only stores discards nothing
      monitor_collapse_fraction: 0.5       # warn below this observed duplicate fraction
      monitor_window_seconds: 900
      monitor_min_events: 100              # per connection, before the monitor evaluates at all
    rationale: >
      Two independent sockets agree on exactly one clock: the server-assigned
      `event_timestamp`. They do not agree on `sent_at` (a per-message Phoenix
      push timestamp), on `observed_at`, or on `(run, seq)`, and including any of
      those makes the key useless and doubles every count. The code's `valid_at`
      is `event_timestamp or sent_at`, so keying on it would have failed exactly
      where it matters -- E-W3, which the source proposal itself classes S0. The
      key is therefore built from `event_timestamp` alone, and a row lacking it
      is marked un-dedupable and COUNTED rather than merged on a guess.
      The key is widened past the requested
      (event_type, order_hash, event_timestamp) because `order_hash` is NULL for
      item_transferred, for some item_sold shapes and for item_metadata_updated
      (E-U3), so the bare triple would merge two genuinely distinct transfers in
      the same second; `tx_hash` is the natural disambiguator for exactly those
      types and was already parsed and stored.
      Two reasonable people could disagree about three things here, which is why
      this is an assumption and not a fact.
      (1) WIDTH. Too narrow and distinct events collapse -- an undercount, which
      understates activity. Too wide and duplicates survive -- every count and
      every rate doubles and a backtest looks wonderful, which is the S0
      direction and the one the fifth project rule names. The width chosen errs
      wide-ish in the fields it includes and is watched by the duplicate-fraction
      monitor rather than trusted.
      (2) MULTIPLICITY. The first version of this entry said the opposite: that
      taking the MAXIMUM over connections was "the reading that cannot double",
      because one-per-key would erase a genuine repeat delivery down one socket.
      That was wrong and it was wrong in the expensive direction. A rejoin replay
      is not exotic -- it is what OpenSea does to a subscriber that rejoins -- and
      A x 1 / B x 2 under a maximum is 2, so one real event becomes two and every
      count over it doubles (BUG-20260911-073). One-per-key is now the rule. Its
      cost is real and is an UNDERCOUNT: a genuine repeat down one socket is
      recorded as one event, because two rows agreeing on every field in the key
      are indistinguishable from one event delivered twice. Understating activity
      is the safe direction; the discarded multiplicity is written down per
      connection and the disagreements are counted, so the size of the ambiguity
      is auditable rather than assumed away.
      (3) THE MONITOR'S 0.5. This has NOT been measured. No two-connection
      capture exists yet, so the expected duplicate fraction under a healthy pair
      is unknown -- the argument for "high" is structural (both sockets are
      subscribed to the same topics) rather than observational. 0.5 is a
      deliberately loose floor chosen so the alarm fires on a collapse and not on
      ordinary loss. Replace it with the trough of the measured distribution as
      soon as one exists; until then the number carries whatever error that
      guess has, and the review date is short for that reason.
      (4) THE MULTIPLICITY-DISAGREEMENT THRESHOLD of 0 -- any disagreement warns --
      is ALSO unmeasured, and it is the one most likely to prove noisy: if
      rejoin-replay is routine, this alarms routinely, and an alarm that fires
      routinely is one the Operator learns to ignore. It is 0 because no
      two-connection capture exists to derive a baseline from, and an alarm that
      is too loud is recoverable where one that is too quiet is not. Raise it from
      a measured replay rate, not from irritation.
      (5a) GAP COVERAGE IS REVOCABLE. A connection killed without warning records
      its gap on the next START, not on the death, so a fold in between annotates
      on evidence that is incomplete and later wrong. The annotation is therefore
      cleared when the evidence stops supporting it, and each transition is logged
      once. Two reasonable people could disagree about whether a derived
      annotation in the operational store may be rewritten at all; the ruling is
      that it may, because gap_register is disposable and reconstructible (docs/07
      §1) and close_gap already updates it in place, while the invariant that a gap
      is never closed, shortened or removed is untouched and asserted.
      (5) GAP COVERAGE is subtracted, not read: the landing manifest only closes a
      file on a CLEAN stop, so after a sleep or a kill it claims coverage through
      the window in which the connection recorded nothing, and on one laptop both
      connections make that claim about the same window. Coverage is therefore the
      manifest intervals minus that connection's own gap register, and only a gap
      covered END TO END is annotated. Partial coverage is deliberately not
      representable: every consumer of the register treats a gap as a unit.
    applies_to: [order_lives, health_dedup, redundant_stream, metrics_counts, gap_register]
