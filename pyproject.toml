[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navanax"
version = "0.1.0"
description = "OpenSea data consolidation, analysis and trade-discovery platform"
# BUG-20260909-011. 3.10, not 3.12: the Linux workspace the operator actually runs this in is
# Python 3.10.12, where `datetime.UTC` and `StrEnum` do not exist. A
# requires-python the real environment cannot satisfy is the same
# claim-versus-reality failure as a wrong docstring.
requires-python = ">=3.10"
dependencies = [
  "websockets>=12.0",
  "zstandard>=0.23.0",   # <0.23 defaulted read_across_frames=False (BUG-20260909-010)
  "PyYAML>=6.0",
  "httpx>=0.27.0",
  "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
analysis = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "statsmodels>=0.14",
            "lifelines>=0.28", "plotly>=5.22"]

[project.scripts]
navanax = "navanax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly. An unspecified ruleset silently changes when ruff updates,
# which turns a green CI red on a day nobody touched the code (BUG-20260909-004).
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S110"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # function call in argument default -- deliberate for injected clocks
  "UP038",   # isinstance tuple form is clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]        # asserts are the point of a test file
"tools/preflight.py" = ["E402"]  # sys.path setup must precede the local import

[tool.pytest.ini_options]
testpaths = ["tests"]
