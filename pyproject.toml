[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navanax"
version = "0.1.0"
description = "OpenSea data consolidation, analysis and trade-discovery platform"
requires-python = ">=3.12"
dependencies = [
  "websockets>=12.0",
  "zstandard>=0.22.0",
  "PyYAML>=6.0",
  "httpx>=0.27.0",
  "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
analysis = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "statsmodels>=0.14",
            "lifelines>=0.28", "plotly>=5.22"]

[project.scripts]
navanax = "navanax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
