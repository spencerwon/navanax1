- id: BUG-20260909-018
  summary: A landing-zone write failure (disk full) is misrecorded as a stream gap and retried forever
  severity: S2
  priority: P2
  error_class: INF
  status: fixed
  resolved_at: "2026-09-09T11:20:00-05:00"
  logged_at: "2026-09-09T07:40:00-05:00"
  detected_by: "validator agent (opus), first review"
