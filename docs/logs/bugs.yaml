  detection_channel: operator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/stream.py, line: 71}
  - {file: tools/preflight.py, line: 183}
  requirement: REQ-D-26
  data_impact: "None. No ingestion had run; the consumer crashed loudly on its first frame before writing anything."
  root_cause: >-
    Phoenix ships two serialisers. v1 sends maps; v2 sends arrays
    [join_ref, ref, topic, event, payload]. OpenSea uses v2. The code called
