- id: BUG-20260909-002
  summary: Stream consumer assumed Phoenix v1 map frames; OpenSea sends v2 arrays
  severity: S3
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T02:20:00-05:00"
  occurred_at: "2026-09-09T00:50:00-05:00"
  resolved_at: "2026-09-09T02:35:00-05:00"
