- id: BUG-20260909-027
  summary: Ingest refused to start on any filesystem without flock, reporting a second instance that did not exist
  severity: S2
  priority: P1
  error_class: INF
  status: fixed
  logged_at: "2026-09-09T09:50:00-05:00"
  occurred_at: "2026-09-09T09:40:00-05:00"
  resolved_at: "2026-09-09T10:10:00-05:00"
  detected_by: "tech-lead agent (opus), gate review"
  detection_channel: tech-lead
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/cli.py, line: 64}
  requirement: REQ-D-14
  data_impact: >-
    The single-instance guard from BUG-022 caught OSError without checking
    errno. Injecting EOPNOTSUPP -- the reply an SMB/AFP share and some NFS
    mounts give -- made ingest refuse to start and tell the operator to stop a
    process that does not exist, offering two useless remedies. On the default
    local disk it never fires; on a network or external volume it stops
    collection entirely, and a day not recorded cannot be bought back. Failing
    closed was the wrong direction for this specific guard.
  root_cause: "One handler for two unrelated errnos: contention and unsupported."
  resolution: "EWOULDBLOCK/EAGAIN refuse; EOPNOTSUPP/ENOLCK/EINVAL/ENOSYS proceed with a loud, accurate warning that names the real risk."
  regression_test: tests/selftest.py::test_single_instance_degrades_on_unsupported_filesystem
  monitor_gap: "The guard was tested only on the filesystem it was written on."
  pr: 1
