- id: BUG-20260909-011
  summary: pyproject declared requires-python >=3.12 while the operator's actual environment is Python 3.10
  severity: S3
  priority: P1
  error_class: CFG
  status: fixed
  logged_at: "2026-09-09T08:20:00-05:00"
  occurred_at: "2026-09-09T00:15:00-05:00"
  resolved_at: "2026-09-09T08:30:00-05:00"
  detected_by: "orchestrator, after `ruff --fix` rewrote timezone.utc to datetime.UTC and the target environment was checked"
  detection_channel: ci
  branch: feat/phase0-ingestion
  locations:
  - {file: pyproject.toml, line: 9}
  requirement: REQ-N-13
  data_impact: "None yet. Would have been an ImportError at startup on the operator's machine -- loud, not silent."
  root_cause: >-
    requires-python and ruff's target-version both said py312, so ruff
    autofixed timezone.utc into datetime.UTC, which does not exist before
    Python 3.11. The workspace the operator actually runs this in reported
    Python 3.10.12. A requires-python the real environment cannot satisfy is
    the same claim-versus-reality failure as a wrong docstring.
  resolution: "Retargeted to >=3.10, reverted the 3.11-only constructs, and added noqa with a reason where StrEnum would otherwise be suggested."
  regression_test: tests/selftest.py::test_roundtrip_and_verbatim
  monitor_gap: "Nothing checked the declared Python floor against the environment the operator runs in. CI tests 3.12 only."
  pr: 1

- id: BUG-20260909-012
  summary: One 429 permanently bricks the REST governor; server_reset_at is parsed and never read
  severity: S1
  priority: P1
  error_class: RTL
  status: fixed
  resolved_at: "2026-09-09T11:20:00-05:00"
  logged_at: "2026-09-09T07:40:00-05:00"
  detected_by: "validator agent (opus), first review; re-confirmed and escalated in the second"
  detection_channel: validator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/governor.py, line: 166}
  - {file: src/navanax/governor.py, line: 150}
  requirement: REQ-D-02
  data_impact: >-
    server_remaining is set to 0 on a 429 and try_consume takes
    min(tokens, server_remaining). Only a header from a SUCCESSFUL response can
    raise it, and getting one requires a token. So a single 429 disables REST
    for the life of the process. Blast radius grew with the BUG-008 and
    BUG-009 fixes, which now generate far more unbackfilled gaps that can never
    be serviced.
  root_cause: "The recovery path requires the very resource the failure removes. server_reset_at is parsed at governor.py:150 and read nowhere."
  resolution: >-
    The server's "no" now EXPIRES. `server_reset_at` -- already parsed and read nowhere -- is believed when present; absent it, an exponential block capped at 15 minutes, so an unattended process heals itself overnight. `observe_success` also clears `server_remaining`, which was the other half: the block expired and the ceiling did not, so REST stayed disabled anyway. That half was found by the regression test, not by reading the code.
  regression_test: tests/selftest.py::test_governor_recovers_from_a_429
  monitor_gap: "No test ever sent a 429 followed by a recovery attempt."
  pr: 1

- id: BUG-20260909-013
  summary: Every gap is recorded backfillable=True even for event classes REQ-D-09a says are permanently unrecoverable
  severity: S1
  priority: P1
  error_class: ING
  status: fixed
  resolved_at: "2026-09-09T11:20:00-05:00"
  logged_at: "2026-09-09T07:40:00-05:00"
  detected_by: "validator agent (opus), first review; escalated in the second"
  detection_channel: validator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/stream.py, line: 436}
  requirement: REQ-D-09a
  data_impact: >-
    IRRECOVERABLE is referenced only by a test. _open_gap hardcodes
    backfillable=True, contradicting GapRecord's own docstring, and _close_gap
    logs that backfill was enqueued when nothing is enqueued. ESCALATED by the
    BUG-008 fix, which makes clean closes open these gaps too -- so many more
    gaps are now mislabelled recoverable. A gap believed backfillable and never
    backfilled reads downstream as a gap that WAS filled.
  root_cause: "The classification exists as data and was never wired to the code that records gaps. No backfill queue exists yet at all."
  resolution: >-
    `_gap_classes()` splits the subscription against BACKFILLABLE and IRRECOVERABLE. `backfillable` now means "can this gap be FULLY repaired", which for any subscription containing a REQ-D-09a class is False -- and the two class lists say exactly what is and is not recoverable, so nothing has to be inferred from a flag that cannot carry the distinction. `_close_gap` no longer logs that backfill was "enqueued"; it says plainly that no backfill queue exists yet.
  regression_test: tests/selftest.py::test_gaps_are_labelled_by_what_can_actually_be_recovered
  monitor_gap: "Nothing asserts that a recorded gap's backfillable flag matches the event classes it actually spans."
  pr: 1

