  - {file: src/navanax/stream.py, line: 519}
  requirement: REQ-D-14
  data_impact: >-
    run()'s except Exception catches anything, including an OSError from the
    writer, opens a gap blaming the stream, and reconnects. On a full disk this
    loops forever recording gaps it cannot write, and the gap register blames
    OpenSea for a local failure.
  root_cause: "One handler for two unrelated failure domains: the remote connection and the local filesystem."
  resolution: >-
    A new `LandingZoneWriteError` (S2, halts_ingestion=True) separates the two failure domains. Every landing write goes through `_land()`, which converts an OSError into that error; the run loop halts on it instead of opening a gap and reconnecting. Reconnecting is the right response to a remote failure and exactly the wrong one to a local one -- retrying cannot make the disk bigger.
