  detection_channel: operator
  branch: tester
  locations:
  - {file: docs/07_STORAGE_AND_RECORDING.md, line: 108}
  requirement: REQ-D-26
  data_impact: >-
    None to recorded data -- the writer, frames, manifest and codec all held at
    48 events/s without complaint. The impact is to every disk-planning
    statement in the project: "15 GB/year for 200 collections", "free on any
    laptop", "will not for many years". At the measured rate Argonauts ALONE is
    ~660 MB/day, ~240 GB/year, on a MacBook Air. Same family as BUG-003: an
    unsourced estimate repeated until it read as fact, falsified by the first
    real measurement.
  root_cause: >-
    The 2,000/day figure was a guess about a "thin collection" that never
    considered automated market-making. 51% of the flow is item_received_bid
    and 46% item_cancelled, from 10 makers of which 3 account for 88% -- bots
    re-quoting 30-minute bids across hundreds of items continuously. Nobody
    had measured because nothing had ever connected.
  resolution: >-
    docs/07 §2.3 replaced with the measurement, its provenance (run id, window,
    sample size), its limits (one 2-minute sample, one hour, one collection,
    bot-dominated), and the implied daily/yearly figures labelled as
    extrapolations. Old figures withdrawn wherever they appeared in that
    document. Compression measured at 13.8x (not 5.6x) and 2,205 raw
    bytes/event (not 1,150), both now stated with provenance.
