# Navanax bug ledger -- THE SOURCE OF TRUTH for the bug log.
#
# This file is machine-readable on purpose. `docs/logs/BUGS.xlsx` is GENERATED
# from it by `tools/buglog.py`; nobody types into the spreadsheet. A hand-typed
# log drifts from the code within a week, and this project has already shipped
# four bugs whose entire shape was "every artifact agrees except the code".
#
#   python3 tools/buglog.py              # regenerate the spreadsheet
#   python3 tools/buglog.py --check      # CI gate: ledger vs BUGS.md vs code
#
# Owned by the `bug-triage` agent (docs/02_AGENT_HIERARCHY.md).
# Schema and severity definitions: docs/05_BUG_TAXONOMY.md.
#
# severity : S0a data corruption (halt ingestion) | S0b backtest integrity
#            (halt backtests) | S1 silent wrongness | S2 data loss
#            S3 functional break | S4 cosmetic
# priority : P0 drop everything | P1 before the next merge | P2 this phase
#            P3 backlog                          (derived; see 05 §2.2)
# class    : CFG config/env | ING ingestion | NRM normalisation | STA statistics
#            RTL rate limiting | TMP temporal | SEC security | INF infrastructure

repo: spencerwon/navanax1
schema_version: 1

