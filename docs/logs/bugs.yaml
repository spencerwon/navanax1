- id: BUG-20260910-057
  summary: "`immediacy_cost` was an INTERVAL EXTREMUM, not the standing-book quantity docs/01 §3.2 defines -- biased narrow, and able to render negative on the front page"
  severity: S1
  priority: P0
  error_class: STA
  status: fixed
  logged_at: "2026-09-10T07:30:00-05:00"
  occurred_at: "2026-09-09T08:00:00-05:00"
  resolved_at: "2026-09-10T09:10:00-05:00"
  detected_by: "quant-research (T2) and tech-lead (Q-V8/Q-W4), fact-checking the 2026-09-09 metric proposals against docs/01 §3.2"
  detection_channel: review
  branch: feat/standing-book-spread
  locations:
  - {file: src/navanax/metrics.py, line: 29}
  - {file: src/navanax/metrics.py, line: 74}
  - {file: docs/08_DASHBOARD.md, line: 109}
  requirement: REQ-F-13a
  data_impact: >-
    No record is wrong; every stored event is untouched. The damage is entirely
    in what was computed from them and charted. `_bucketed` aggregated MIN over
    the ask leg and MAX over the bid leg WITHIN a bucket and subtracted the two,
    so the number on the front page was the distance between the cheapest ask
    seen at any point in the interval and the richest offer seen at any other
    point -- two prices that need never have coexisted, and on this collection
    usually did not. The bias has a known sign: the spread is too NARROW, and
    the error grows with the interval, so the 1d bars were worse than the 5m
    bars in exactly the way nobody would notice. Because the two legs are
    unrelated in time it could also go NEGATIVE, which the KPI card would have
    rendered as a free arbitrage -- and a negative immediacy cost on a screen
    whose purpose is trade decisions is the fifth project rule's exact failure
    shape. On the fixture that reproduces it the old path returns -0.10 and the
    new one returns null with an alarm. Separately, `bid_lifetimes` returned
    p10/median/p90 at ANY n with a `percentiles_reliable: false` flag beside
    them, and `ui/index.html:215` rendered the numbers and appended the flag as
    a string, which REQ-F-19 (docs/00:199) says the system SHALL make
    impossible.
  root_cause: >-
    The metric was implemented from its NAME rather than from its definition.
    docs/01 §3.2 says "what you pay to force time-to-clear to zero by hitting
    the STANDING collection offer"; the code computed an interval extremum,
    which is a different quantity that happens to coincide with it when the
    interval is short and the book is deep. Neither condition holds here. The
    deeper cause is that until PR-2 there was no relation that could answer
    "what was resting at time tau", so a bucket aggregate was the only thing
    available and it was written before `order_lives` existed. The percentile
    half is the same habit at one remove: a flag next to a number was mistaken
    for a refusal to produce the number.
  resolution: >-
    `immediacy_cost` is recomputed from `order_lives` as a standing-book spread.
    `MetricEngine.standing_series(kind, ...)` sweeps placements and terminations
    (a lazily-cleaned heap, O(events log events), never a per-bucket scan) to
    produce the running extremum of the resting book as constant segments, and
    reports per bucket the TIME-WEIGHTED median with [p10, p90], coverage =
    seconds the leg stood / observable bucket seconds, and n = distinct orders
    standing. `MetricEngine.standing_spread` intersects the ask and bid segment
    lists so both legs are read at the SAME tau, and any bucket in which the
    book crossed (ask < bid at any tau) is returned as null, counted in
    `basis.negative_buckets` and logged once per collection/interval/denomination
    rather than charted. Leg discipline per quant metric 1 -- the bid leg is a
    COLLECTION offer, which applies to every token and is therefore a bid on
    whichever token is at the floor; item bids and trait offers are per-token and
    would mix populations. `floor_ask` and `collection_bid` take the same
    standing treatment and default to it (Operator's decision, 2026-09-10:
    floors are built from standing asks only, and a bucket with no live ask is a
    hole). The old interval-extremum behaviour stays reachable as
    `book='observed'`, is labelled in `basis.book`, and carries an
    `observed_book_warning` saying what it is not. `/api/series` passes `book`
    through. Percentiles: one `pct(values, p, min_n=MIN_N_FOR_PERCENTILES)`
    helper that returns None below the minimum, applied to `bid_lifetimes` for
    all three quantiles -- a median is a percentile too -- and to the [p10, p90]
    band of every standing series. The standing MEDIAN is not suppressed: it is
    the level of a continuously observed step function, a fact at n = 1, and
    withholding it would blank the chart wherever the book is genuinely one
    listing deep. Every standing response carries `left_truncated: true` with the
    reason, because the reconstructed floor is an upper bound.
  regression_test:
  - tests/selftest.py::test_immediacy_cost_is_a_standing_book_spread
  - tests/selftest.py::test_standing_series_is_time_weighted_over_the_bucket
  - tests/selftest.py::test_percentiles_are_withheld_below_min_n
  monitor_gap: >-
    Every existing test asserted the metric against its own implementation. The
    contract test checked "immediacy_cost = lowest ask - highest collection
    offer, in the ONE interval with both" -- the extremum definition restated,
    so it could not falsify it -- and the 5-minute case asserted that two legs in
    different buckets produce UNDEFINED, which is the defect written down as
    intended behaviour. No fixture ever placed an ask and a bid that were alive
    at the same instant but seen in different buckets, and none ever crossed the
    book, so nothing could produce the negative value. The general lesson is the
    one this log keeps recording: a test written from the code cannot find a
    requirement violation. The narrow fix is that every metric with a definition
    in docs/01 §3 now needs a test written from that TEXT, not from the
    function.
  pr: null

