- id: BUG-20260909-020
  summary: verify_manifest still could not detect a decoder returning a prefix of an intact file
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T08:05:00-05:00"
  occurred_at: "2026-09-09T09:05:00-05:00"
  resolved_at: "2026-09-09T09:40:00-05:00"
  detected_by: "validator agent (opus), second review"
  detection_channel: validator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/landing.py, line: 608}
  requirement: REQ-D-28
  data_impact: >-
    The sha256 is over the COMPRESSED bytes, so a byte-perfect file whose
    decoder returns only the first frame verified clean. Measured on the
    post-fix code: manifest said 20 events, read_file returned 1, no exception,
    verify_manifest returned [] and `navanax verify` printed "verified clean".
    BUG-007 taught the manifest to record the count that catches this and
    BUG-010's fix did not connect the two halves.
  root_cause: "Both halves of the detector existed in the same file and nothing compared them."
  resolution: >-
    verify_manifest(deep=True) decompresses each closed file and compares the
    record count against the manifest, reporting COUNT MISMATCH as an integrity
    failure. read_file's tolerate_truncation now defaults to False, so an
    ordinary read raises instead of silently returning a prefix. `verify
    --shallow` is available for the fast path and says what it cannot detect.
  regression_test: tests/selftest.py::test_verify_detects_decoder_truncation
  monitor_gap: "The audit checked the property that was easy to check, not the one that had already gone wrong once."
  pr: 1

