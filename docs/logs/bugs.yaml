  detection_channel: ci
  branch: feat/phase0-ingestion
  locations:
  - {file: pyproject.toml, line: 30}
  - {file: .github/workflows/ci.yml, line: 1}
  requirement: REQ-N-13
  data_impact: "None. Style only."
  root_cause: >-
    [tool.ruff] set only line-length and target-version with no select, so the
    effective ruleset was whatever ruff's defaults were in the version CI
    installed -- a green build could go red on a day nobody touched the code.
