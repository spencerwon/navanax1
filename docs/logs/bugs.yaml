- id: BUG-20260909-039
  summary: OpenSea's payment_token.eth_price is the ORDER'S VALUE on bids/listings but the TOKEN'S RATE on sales; a parser trusting it records a 1.43 ETH sale as 1.00
  severity: S1
  priority: P0
  error_class: NRM
  status: fixed
  logged_at: "2026-09-09T11:20:00-05:00"
  occurred_at: "2026-09-09T11:05:00-05:00"
  resolved_at: "2026-09-09T11:40:00-05:00"
  detected_by: "orchestrator, validating the new parser against every real frame on the operator's machine before shipping (74,286 frames) -- the first real item_sold"
  detection_channel: validator
  branch: tester
  locations:
  - {file: src/navanax/normalize.py, line: 153}
  requirement: REQ-F-02
  data_impact: >-
    None -- caught before the normalizer ever ran for real. Had it shipped:
    every sale price in the store would have been the WETH/ETH exchange rate
    (~1.0009) instead of the sale value, a ~30% error on the first real sale,
    silent, in the one event type every downstream metric cares about most.
    Same field, different meaning, per event type, documented nowhere. Also
    found: multi-item collection offers report the TOTAL (0.906 for 2 x 0.453);
    29 rows in the first hour.
  root_cause: "The field was trusted as a value. The stream is not internally consistent about what it means."
  resolution: >-
    _resolve_price() checks rather than trusts: wei / 10^decimals is always the
    per-item token amount; if eth_price matches units x quantity it is a total
    value (per-item = value / quantity); if not and it looks like a per-unit
    rate, value = units x rate. The basis used is stored on every row
    (price_basis) so an audit can list every row where the forms disagreed.
    Fixtures replaced with the REAL sale and listing.
  regression_test: tests/selftest.py::test_normalizer_parses_real_frames
  monitor_gap: >-
    The sale and listing fixtures were written from OpenSea's documentation
    before any had been observed -- the BUG-002 shape. Running the parser over
    all real frames before shipping is what caught it, and that check is now
    how new parsers are accepted.
  pr: 3

