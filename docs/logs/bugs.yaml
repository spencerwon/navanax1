  resolution: "Added normalize_frame() handling both wire formats; both call sites route through it."
  regression_test: tests/selftest.py::test_phoenix_v2_arrays
  monitor_gap: >-
    No test used a real frame. Every synthetic fixture was a v1 map because that
    is the format I wrote them in -- the test data inherited the bug from the
    code it was testing.
  pr: 1

