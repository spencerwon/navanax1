- id: BUG-20260909-038
  summary: The self-test ran from a hand-maintained list; three tests in one day were written, reviewed, and never executed -- including the codec gate's own self-test
  severity: S1
  priority: P0
  error_class: INF
  status: fixed
  logged_at: "2026-09-09T10:50:00-05:00"
  occurred_at: "2026-09-09T05:00:00-05:00"
  resolved_at: "2026-09-09T11:00:00-05:00"
  detected_by: "orchestrator, noticing the pass count did not rise after adding a test -- for the third time"
  detection_channel: operator
  branch: tester
  locations:
  - {file: tests/selftest.py, line: 1660}
  requirement: REQ-N-13
  data_impact: >-
    None to data. But BUG-032's ledger entry named
    test_startup_gate_refuses_a_lying_codec as its regression test, and
    tools/buglog.py --check confirmed the function EXISTED -- which is all it
    checks -- while the function had never once run. "The gate has its own
    regression test" was true of the file and false of the run. This is the
    exact claim-versus-reality shape the whole ledger exists to prevent,
    inside the ledger's own evidence.
  root_cause: >-
    main() ran tests from an explicit tuple of names. Registering a test was a
    second step, done by string replacement against a line that other edits
    kept changing, so the replacement silently matched nothing. Three times.
