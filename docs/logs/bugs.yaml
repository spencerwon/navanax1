- id: BUG-20260909-032
  summary: First real-zstandard CI run turned the codec gate red -- the gate's "last frame" heuristic assumed gzip's writer behaviour, and the frame walk still guessed boundaries by magic scanning
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T12:10:00-05:00"
  occurred_at: "2026-09-09T09:05:00-05:00"
  resolved_at: "2026-09-09T12:40:00-05:00"
  detected_by: "GitHub Actions CI on the tester branch -- the first time the production codec was ever executed by anything"
  detection_channel: ci
  branch: tester
  locations:
  - {file: src/navanax/codec.py, line: 150}
  - {file: src/navanax/codec.py, line: 168}
  - {file: src/navanax/codec.py, line: 300}
  requirement: REQ-D-26a
  data_impact: >-
    None to data -- the gate refused, which is the safe direction. But it
    refused for the WRONG reason: the truncation test found "the last frame"
    by scanning for the last zstd magic, and real zstandard's close() appends
    an EMPTY epilogue frame after the last FLUSH_FRAME, which gzip's writer
    does not. The cut landed in the epilogue, all five content frames
    survived (40 bytes where 32 were expected), and the gate said no. A gate
    whose expectation is wrong is a gate nobody trusts. Meanwhile the walk
    itself still located frames by magic-byte scanning, the residual hazard
    BUG-024 could only exclude with a startup check rather than remove.
  root_cause: >-
    Two assumptions inherited from the stand-in codec. (1) The gate's cut
    heuristic was written against gzip, whose writer emits nothing on close,
    and was never run against the real binding -- the sandbox cannot install
    it. (2) Frame boundaries were guessed from magic bytes and validated by
    trial, because it was not known that zstandard.decompressobj() exposes
    `eof` and `unused_data` exactly as zlib.decompressobj does. Same family
    as BUG-002: the fixture inherited the author's assumption.
  resolution: >-
    Three changes. The zstd writer no longer closes the compressor when no
    frame is open, so no empty epilogue frame is written. The frame walk now
    uses decompressobj(): a frame ends where the decoder says it ends
    (`unused_data`), and a frame is complete only if the decoder says it is
    (`eof`) -- truncation detection is ours, not the binding's, and the
    false-magic hazard is gone structurally rather than checked for. The gate
    records the last content frame's byte range BEFORE close() and cuts inside
    it two ways (tail and header), and a new test proves the gate refuses
    three deliberately lying codecs while passing an honest one that appends
    an epilogue. tools/zstd_probe.py runs first in CI and prints what the
    binding actually does, so a red X arrives with its reason.
  regression_test: tests/selftest.py::test_startup_gate_refuses_a_lying_codec
  monitor_gap: >-
    The production codec had never been executed by anything until CI ran it.
    Every local assertion about zstd behaviour was reasoning, and two of them
    were wrong. Nothing short of running the real binding could have caught
    this, which is what CI is for -- and why the probe step now exists.
    CONFIRMED: the next CI run passed the codec contract on real zstandard
    and failed further downstream (BUG-033) -- the first executed proof that
    the production compressor round-trips multi-frame files and refuses
    truncated ones.
  pr: 2

- id: BUG-20260909-033
  summary: The REQ-N-11 credential gate fired on a 14-character test placeholder the first time it ever ran
  severity: S3
  priority: P0
  error_class: SEC
  status: fixed
  logged_at: "2026-09-09T13:05:00-05:00"
  occurred_at: "2026-09-09T02:40:00-05:00"
  resolved_at: "2026-09-09T13:30:00-05:00"
  detected_by: "GitHub Actions CI on PR #2 -- the step had never executed before; every earlier run died upstream of it"
  detection_channel: ci
  branch: tester
  locations:
  - {file: .github/workflows/ci.yml, line: 61}
  - {file: tools/secrets_check.py, line: 1}
  requirement: REQ-N-11
  data_impact: >-
    None. But the failure mode is the dangerous kind for a security gate: a
    check that cries wolf on `OPENSEA_API_KEY=fake_key_value` teaches everyone
    to click past it, and the day it fires on a real 32-character key nobody
    looks. A gate with no precision has no authority.
  root_cause: >-
    A one-line grep matching NAME=<any alphanumeric>. It could not distinguish
    a placeholder from a key because it never asked what a key looks like.
    Written in the same sitting as the rest of ci.yml and, like the pytest
    step (BUG-019), never run end to end until CI could reach it.
  resolution: >-
    tools/secrets_check.py replaces the grep. It flags a credential name
    assigned a value of 20+ key-alphabet characters, any GitHub token prefix
    followed by token-shaped text, and any 12-word run beside "mnemonic" or
    "seed". tests/ is deliberately NOT exempt -- the check was made precise,
    not blind. Its own regression test proves it stays quiet on the suite's
    fixtures and fires on a planted 32-char key, a PAT, and a seed phrase.
  regression_test: tests/selftest.py::test_secrets_gate_knows_what_a_key_looks_like
  monitor_gap: "A CI step that had never executed. Same shape as BUG-019: the pipeline was written, not run."
  pr: 2

