  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/landing.py, line: 608}
  requirement: REQ-D-28
  data_impact: >-
    The sha256 is over the COMPRESSED bytes, so a byte-perfect file whose
    decoder returns only the first frame verified clean. Measured on the
    post-fix code: manifest said 20 events, read_file returned 1, no exception,
    verify_manifest returned [] and `navanax verify` printed "verified clean".
    BUG-007 taught the manifest to record the count that catches this and
    BUG-010's fix did not connect the two halves.
