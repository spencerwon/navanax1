- id: BUG-20260909-022
  summary: Manifest read-modify-write had no cross-process lock; concurrent writers silently lost gap records
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T08:05:00-05:00"
  occurred_at: "2026-09-09T00:30:00-05:00"
  resolved_at: "2026-09-09T09:40:00-05:00"
  detected_by: "validator agent (opus), second review; cross-process claim independently re-measured by tech-lead"
  detection_channel: validator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/landing.py, line: 116}
  - {file: src/navanax/cli.py, line: 51}
  requirement: REQ-D-28
  data_impact: >-
    threading.Lock is process-local and each writer builds its own.
    os.replace makes the file never CORRUPT; it does not make the update not
    LOST. Measured with two writers: 295 of 600 gap records lost, verify clean.
    A lost FILE record is detectable as an ORPHAN; a lost GAP record is
    undetectable by anything, forever. BUG-006 and BUG-007 together raised the
    collision rate from once per file close to once every few seconds from an
    independent daemon thread per writer.
  root_cause: "An in-process lock guarding an inter-process critical section."
  resolution: >-
    fcntl.flock on _manifest/.manifest.lock around every read-modify-write,
    plus a single-instance guard in cli.py that refuses a second ingest against
    the same landing zone. Tech-lead re-measured with four real PROCESSES
    (the shipped test uses threads): 600 written, 600 held, 0 lost.
  regression_test: tests/selftest.py::test_concurrent_manifest_writes_lose_nothing
  monitor_gap: "No test ran two writers against one root at all."
  pr: 1

- id: BUG-20260909-023
  summary: A live gap was filed under one day and never recorded when it ended; only the restart path was fixed
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T09:50:00-05:00"
  occurred_at: "2026-09-09T09:40:00-05:00"
  resolved_at: "2026-09-09T10:10:00-05:00"
  detected_by: "tech-lead agent (opus), gate review -- caught what the validator and the author both missed"
  detection_channel: tech-lead
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/stream.py, line: 486}
  - {file: src/navanax/landing.py, line: 447}
  requirement: REQ-D-14
  data_impact: >-
    _open_gap and _reject_join pass ended_at=None at the moment an outage
    begins, when it has zero duration, so the multi-day fix covered only
    record_downtime_gap. _close_gap wrote to the SQLite gap register and never
    touched the manifest. Measured on the real consumer path: a Friday 18:00 to
    Monday 03:00 disconnect produced ONE manifest file and a gap saying
    ended_at null forever. docs/07 says a reader MUST resolve through the
    manifest and classifies the SQLite store as disposable, so this was a
    permanent hole in the irreplaceable record -- a reader could not tell a
    three-second reconnect from a lost weekend.
  root_cause: >-
    The fix's own regression test called record_gap with BOTH endpoints known,
    which production never does. It proved the helper, not the path. That is
    the tech-lead charter's blocking criterion "a test whose assertion would
    pass against a broken implementation", applied to the author.
  resolution: >-
    GapRecord gained gap_id so a closure can complete the record it belongs to
    rather than orphan it. _close_gap and the join-recovery path both call
    writer.close_gap_record, which re-files the completed gap across every day
    it turned out to span. _dates_spanned takes the writer's clock so an
    open-ended gap is deterministic, validates its date before it becomes a
    filename, and on a >366-day span keeps BOTH ENDS rather than dropping the
    most recent dates.
  regression_test: tests/selftest.py::test_gap_spans_every_day_through_the_consumer_path
  monitor_gap: >-
    The test exercised a pure helper. Nothing drove _open_gap and _close_gap,
    which are the only ways a gap is created in production.
  pr: 1

- id: BUG-20260909-024
  summary: A chance frame-magic inside compressed data could silently truncate a file if the zstd binding returned partial data
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T08:05:00-05:00"
  occurred_at: "2026-09-09T09:05:00-05:00"
  resolved_at: "2026-09-09T09:40:00-05:00"
  detected_by: "validator agent (opus), second review"
  detection_channel: validator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/codec.py, line: 171}
  - {file: src/navanax/codec.py, line: 366}
  requirement: REQ-D-26a
  data_impact: >-
    _zstd_walk finds frame boundaries by a 4-byte magic, which occurs by chance
    inside compressed data with probability about 1.5% per 64 MB file -- three
    or four files a year at the documented 15 GB/year. The hazard needs TWO
    things: that chance magic, AND a binding whose stream_reader returns a
    partial result instead of raising on a short frame. With the second, strict
    mode accepted the false boundary and returned a truncated file reporting
    success.
  root_cause: "A correctness property left resting on undocumented third-party behaviour -- the same class as BUG-010, one layer down."
  resolution: >-
    verify_codec_roundtrip now asserts that strict decompress RAISES on a
    truncated file, and refuses to ingest if it returns a prefix -- which
    eliminates the second precondition, so a false boundary is simply retried
    against the next candidate. It also asserts that recovery returns ALL
    complete frames, not just frame 0. RawCodec gained a real truncation
    detector rather than being exempted. The gate runs at ingest startup and in
    CI against the real library.
  regression_test: tests/selftest.py::test_codec_multiframe_contract
  monitor_gap: >-
    zstandard cannot be installed in the sandbox this is written in, so the
    production codec has no local coverage by construction. The startup gate
    exists because the test suite structurally cannot run there.
  pr: 1

