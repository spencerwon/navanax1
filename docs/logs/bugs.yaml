    verify_manifest(deep=True) decompresses each closed file and compares the
    record count against the manifest, reporting COUNT MISMATCH as an integrity
    failure. read_file's tolerate_truncation now defaults to False, so an
    ordinary read raises instead of silently returning a prefix. `verify
    --shallow` is available for the fast path and says what it cannot detect.
  regression_test: tests/selftest.py::test_verify_detects_decoder_truncation
  monitor_gap: "The audit checked the property that was easy to check, not the one that had already gone wrong once."
