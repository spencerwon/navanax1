  occurred_at: "2026-09-09T11:20:00-05:00"
  resolved_at: "2026-09-09T12:00:00-05:00"
  detected_by: "tech-lead agent (opus), third gate review; the pre-existing 'server header caps local optimism' assertion caught the first attempt at the fix"
  detection_channel: tech-lead
  branch: tester
  locations:
  - {file: src/navanax/governor.py, line: 217}
  - {file: src/navanax/governor.py, line: 360}
  requirement: REQ-D-02
  data_impact: >-
    observe_response applied headers, then observe_success cleared any
    server_remaining reading 0 -- including when a 200 had JUST said
    "remaining: 0", meaning "that was your last one". The governor then granted
    against its local model and earned a 429 it had been explicitly warned
    about. A new regression introduced by the BUG-012 fix: the old
    observe_success only cleared consecutive_429. Self-correcting via the
    now-recovering 429, so bounded -- but it burned a budget this project
    treats as scarce, and contradicted the requirement the BUG-012 fix cited.
  root_cause: >-
    One field carried two meanings -- a ceiling WE imposed after a 429, and one
    the SERVER reported -- and the fix lifted both. The first attempt at
    fixing this made the block expiry do the same thing, which the
    pre-existing test caught.
  resolution: >-
    BudgetState.remaining_from_429 records who set the ceiling. Only a
    self-imposed one is lifted on success or on block expiry; a server-reported
    one stands until the server says otherwise. Reset headers are sanity
    checked: a value under a year is a delta, not a 1970 epoch. available()
    now expires the block too, so recovery is no longer order-dependent.
  regression_test: tests/selftest.py::test_truthful_zero_remaining_is_not_discarded
  monitor_gap: "BUG-012's test asserted recovery and never asserted that the server's own 'no' was still honoured."
  pr: 1

