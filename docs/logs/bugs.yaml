- id: BUG-20260909-049
  summary: "`bid_lifetimes` joined events to events with no first-termination restriction -- one bid with two cancel rows produced a cross product, so `n = 38,286` was a count of bid x cancel PAIRS, not of bids"
  severity: S1
  priority: P0
  error_class: TMP
  status: fixed
  logged_at: "2026-09-09T18:10:00-05:00"
  occurred_at: "2026-09-09T11:00:00-05:00"
  resolved_at: "2026-09-09T18:40:00-05:00"
  detected_by: "quant-research (T1), confirmed by tech-lead fact-check Q-V2"
  detection_channel: quant-research
  branch: data-engineer
  locations:
  - {file: src/navanax/metrics.py, line: 447}
  requirement: REQ-F-19
  data_impact: "Every published bid-lifetime figure. The median 9 s / p10 3.2 s / p90 234 s / n = 38,286 in this log is from the defective estimator: inflated n, distribution skewed LONG by the duplicate pairs and SHORT by dropped right-censoring, so the net sign of the error is unknown. The number must not be quoted as a market fact."
  root_cause: >-
    The join had no MIN(c.valid_ts), no LIMIT 1 and no first-termination
    restriction, and there was no relation that held one row per order for it
    to read. It also silently dropped every bid still standing at window end
    (an inner join), and every pair where the terminator's valid_ts was NULL.
  resolution: "`order_lives` -- one row per order_hash, terminated by the FIRST qualifying termination -- is folded in `Normalizer.sync()` and `bid_lifetimes` reads it. Durations are ended lives only; still-standing lives are reported as `censored_n`, untimed terminators as `unknown_terminator_n`, and terminations whose placement was never seen as `orphan_terminations` with `terminations_in_window` beside the rate (project rule 4)."
  regression_test: tests/selftest.py::test_bid_lifetimes_censoring_and_orphans
  monitor_gap: "The only lifetime test used one bid and one cancel, so a duplicate terminator could not appear. The new test asserts the old join still returns 2 pairs for 1 bid, so the defect it fixes stays visible."
  pr: 5

- id: BUG-20260909-050
  summary: "The `dead` predicate ignored `order_revalidate`, ignored `quantity`, and never matched a terminator whose `valid_ts` was NULL -- a revalidated order was dead forever, a quantity-5 offer counted as one unit of depth, and an untimed cancel left its order standing forever"
  severity: S1
  priority: P0
  error_class: TMP
  status: fixed
  logged_at: "2026-09-09T18:10:00-05:00"
  occurred_at: "2026-09-09T11:00:00-05:00"
  resolved_at: "2026-09-09T18:40:00-05:00"
  detected_by: "quant-research (T3), confirmed by tech-lead fact-check Q-V5/Q-V6/Q-V7"
  detection_channel: quant-research
  branch: data-engineer
  locations:
  - {file: src/navanax/metrics.py, line: 394}
  - {file: src/navanax/metrics.py, line: 478}
  requirement: REQ-F-13a
  data_impact: "The live book and the screener, both directions at once. An order invalidated then revalidated is missing from the book (depth understated); an order whose cancel carried no `event_timestamp` stands in the book forever (depth overstated, and the price shown cannot be hit); every multi-unit collection offer counted as one unit. `d.valid_ts >= e.valid_ts` is NULL when the terminator is untimed -- not TRUE -- so the terminator was never seen."
  root_cause: >-
    Three places in one module each carried their own list of what ends an
    order (`cancel_count` two types, `bid_lifetimes` one, the `dead` subquery
    three) and none of them was a relation, so none could express "the first
    termination", "unless revalidated", or "we saw it end but cannot say when".
  resolution: "One predicate, `metrics.standing_sql(alias, now_ts)`, over the `order_lives` relation, used by `live_book`, `screener` and `bid_lifetimes`. A revalidate strictly after an invalidate supersedes it; a terminator with a NULL `valid_ts` makes the life `unknown`, which is excluded from the book AND counted; `quantity` is carried from the placement and `live_book` reports depth in units. Expiry is a derived exit at `expiration_ts` with `exit_source='derived'` and writes no row to `events`."
  regression_test: tests/selftest.py::test_order_lives_primitive
  monitor_gap: "The lifecycle test covered cancelled, expired and filled asks -- the three cases the predicate already handled. Nothing exercised a revalidate (1 in 85,775 frames), a NULL-`valid_ts` terminator, or a quantity above 1. Rarity is what made these invisible, so the fixtures now contain all three."
  pr: 5

- id: BUG-20260909-051
  summary: "`trait_offer` criteria were parsed by nothing and stored nowhere, so every trait offer was blanket-excluded under every trait filter -- 58.5 offers/hour of pure revealed demand discarded, and the exclusion could not distinguish an offer that does not apply from one we simply could not read"
  severity: S1
  priority: P0
  error_class: NRM
  status: fixed
  logged_at: "2026-09-09T18:10:00-05:00"
  occurred_at: "2026-09-09T13:40:00-05:00"
  resolved_at: "2026-09-09T18:40:00-05:00"
  detected_by: "data-engineer proposal §4, confirmed by tech-lead fact-check E-V10"
  detection_channel: tech-lead
  branch: data-engineer
  locations:
  - {file: src/navanax/normalize.py, line: 241}
  - {file: src/navanax/metrics.py, line: 269}
  requirement: REQ-F-07
  data_impact: "Bid depth under any trait filter was understated by every trait offer that genuinely applied -- the exact signal a trait-pricing view is built on. BUG-045's blanket exclusion was the correct placeholder while the criteria were unstored; it became wrong the moment they could be stored."
  root_cause: >-
    `parse_event` never read `trait_criteria`, `trait_criteria_list` or
    `numeric_trait_criteria_list`, and there was no criteria table, so
    `_bucketed` had no evidence to match on and could only exclude the whole
    class.
  resolution: "`order_criteria(run, seq, idx, kind, trait_type, value, num_min, num_max)` plus `criteria_n`/`criteria_numeric_n` on `events`, parsed in `parse_event`, written by `sync()`, values verbatim and never case-folded. The blanket exclusion becomes the COVERS rule (docs/08 §4a): an offer counts iff `criteria_n > 0 AND criteria_numeric_n = 0` and every criterion is guaranteed by the filter's clauses. PARTIAL, DISJOINT, UNKNOWN and UNPARSED are reported separately by `trait_offer_verdicts` and never summed into the depth number."
  regression_test: tests/selftest.py::test_trait_offer_matching_rule
  monitor_gap: "The guard is one line from being a disaster: an unparsed offer has no criteria rows, which makes the match's NOT EXISTS vacuously true, so it would match every filter and every token -- silently, and in the direction that manufactures an edge. That failure mode has a named property test (`criteria_n = 0` matches nothing, over every shape of filter) rather than a code comment."
  pr: 5

- id: BUG-20260909-052
  summary: A gap left open by a run that died was never closed -- one stale open record masked every bucket on every chart to infinity
  severity: S1
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T13:05:00-05:00"
  occurred_at: "2026-09-09T12:55:00-05:00"
  resolved_at: "2026-09-09T13:20:00-05:00"
  detected_by: "tech-lead, PR-1 (autostart) review; reproduced with two ordinary start/stop cycles leaving two ended:null manifest records, and a series masked 6/6"
  detection_channel: tech-lead
  branch: tester
  locations:
  - {file: src/navanax/stream.py, line: 566}
  - {file: src/navanax/landing.py, line: 510}
  requirement: REQ-F-15
  data_impact: "None to stored data. Display: every metric including counts null from the orphan gap's start onward -- a recorded period rendered as a hole, the inverse of the promise the installer makes. PR-1 turned this from rare into routine (launchd restarts on every logout, sleep and crash)."
  root_cause: >-
    `_close_gap` closes only the gap this process opened. A run that dies
    mid-disconnect leaves its gap open in the register and the manifest;
    `record_downtime_gap` on the next start opens a NEW bounded gap and never
    looks at the old one. The dashboard treats an open gap as open-ended.
  resolution: "At startup the successor closes every gap a previous run left open, at that run's last checkpoint (where the downtime gap begins), in both the register and the manifest, with a reason naming the successor. Records are re-filed, never deleted."
  regression_test: tests/selftest.py::test_orphan_open_gaps_are_closed_by_the_successor
  monitor_gap: "test_restart_records_downtime_gap covered the NEW gap and never asked what happened to an old one. The two-cycle case is now the test."
  pr: 5

- id: BUG-20260909-053
  summary: order_lives marked an order 'expired' at its expiration time even when that time had not arrived -- standing orders recorded as ended with lifetimes that had not elapsed
  severity: S1
  priority: P0
  error_class: TMP
  status: fixed
  logged_at: "2026-09-09T13:05:00-05:00"
  occurred_at: "2026-09-09T12:30:00-05:00"
  resolved_at: "2026-09-09T13:20:00-05:00"
  detected_by: "tech-lead, PR-2 review; reproduced on a 4,000-order synthetic (5% of lives fabricated, p90 +76%, censored 0) and explained censored=1 of 46,814 on the real corpus"
  detection_channel: tech-lead
  branch: tester
  locations:
  - {file: src/navanax/normalize.py, line: 512}
  requirement: REQ-F-19
  data_impact: "Display only, in the flattering direction: bid lifetimes biased long, the censored bucket drained, so the book looked more durable than it was. The 11.69 s median quoted from the first real-corpus fold is withdrawn until re-folded."
  root_cause: >-
    The fold inferred expiry from `expiration_ts` without testing that the
    expiration had passed. docs/06 §4.3 forbids imputation in DERIVATION;
    recording a future end is imputing the future. The quant's spec stated
    the condition; the implementation dropped it.
  resolution: "Expiry is derived only when expiration_ts < the fold time; otherwise the life is censored. The incremental refresh also re-folds every censored life whose expiration has since passed, so an untouched order cannot stay 'standing' in the table after it expired."
  regression_test: tests/selftest.py::test_expiry_is_never_in_the_future
  monitor_gap: "The unit fixtures had no order whose expiration lay in the future relative to the fold. A censored count of 1 in 46,814 on the real run should have been read as a bug by whoever quoted it -- the fifth project rule, applied to a liquidity number."
  pr: 5

- id: BUG-20260909-054
  summary: "The collection list endpoint carries each token's `traits`; the list pass discarded them and left 9,161 tokens to a per-token fallback (~76 h of REST budget) where the 47 list reads already had the data"
  severity: S3
  priority: P1
  error_class: RTL
  status: fixed
  logged_at: "2026-09-09T15:30:00-05:00"
  occurred_at: "2026-09-09T11:00:00-05:00"
  resolved_at: "2026-09-09T16:00:00-05:00"
  detected_by: "data-engineer, comparing SpencerTinker/scrape.py parse_tokens (reads nft['traits'] from GET /collection/{slug}/nfts; 8,798 tokens with traits in 44 reads) against the traits.py list pass"
  detection_channel: operator
  branch: feat/explorer-traits
  locations:
  - {file: src/navanax/traits.py, line: 9}
  - {file: src/navanax/traits.py, line: 186}
  requirement: REQ-D-01
  data_impact: "No wrong record. The 2026-09-09 list pass spent 47 governed reads and stored name/image/metadata_url only; every Argonauts token has metadata_url NULL, so the only path left to traits was the budgeted OpenSea per-token fallback -- 50 tokens got traits (source opensea_nft) and 9,161 did not. Completing that way costs 9,161 reads: 76 hours of the shared 120/hr budget, during which reconciliation and any INTERACTIVE read compete with it."
  root_cause: >-
    The module docstring asserted the list endpoint "gives each token's name,
    image and metadata_url. NOT its traits" and the code was written to the
    docstring. The assertion was never checked against a response body. The
    test fixture (FakeRest) was written from the same assumption and so could
    not falsify it -- the BUG-002 shape again.
  resolution: "list_tokens() parses `traits` on every list entry and stores it at once (traits_source='opensea_nft_list', traits_at set) for tokens that do not already have traits; fetch_traits() then runs only for tokens whose entry carried none. Docstring corrected to state what is verified (Argonauts, 2026-09-09, from a second tool's raw pull) and that other collections must be re-verified. Separately, `navanax import-traits` loads the friend's cache with zero reads so the already-spent 47 do not need repeating."
  regression_test: tests/selftest.py::test_list_pass_keeps_traits_it_is_given
  monitor_gap: "Nothing compares what an endpoint RETURNS with what the code KEEPS. The raw response bodies of the 47 list reads were not landed (REST responses go through the governor, not the landing zone), so the discarded field left no trace to audit. Worth a follow-up: land REST bodies too, or at least log the top-level keys of the first page of every new endpoint."
  pr: null
