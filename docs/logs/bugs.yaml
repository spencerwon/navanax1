- id: BUG-20260909-002
  summary: Stream consumer assumed Phoenix v1 map frames; OpenSea sends v2 arrays
  severity: S3
  priority: P0
  error_class: ING
  status: fixed
  logged_at: "2026-09-09T02:20:00-05:00"
  occurred_at: "2026-09-09T00:50:00-05:00"
  resolved_at: "2026-09-09T02:35:00-05:00"
  detected_by: "Spencer, first live WebSocket connection"
  detection_channel: operator
  branch: feat/phase0-ingestion
  locations:
  - {file: src/navanax/stream.py, line: 71}
  - {file: tools/preflight.py, line: 183}
  requirement: REQ-D-26
  data_impact: "None. No ingestion had run; the consumer crashed loudly on its first frame before writing anything."
  root_cause: >-
    Phoenix ships two serialisers. v1 sends maps; v2 sends arrays
    [join_ref, ref, topic, event, payload]. OpenSea uses v2. The code called
    .get() on a list. AttributeError on the very first frame -- the join reply.
  resolution: "Added normalize_frame() handling both wire formats; both call sites route through it."
  regression_test: tests/selftest.py::test_phoenix_v2_arrays
  monitor_gap: >-
    No test used a real frame. Every synthetic fixture was a v1 map because that
    is the format I wrote them in -- the test data inherited the bug from the
    code it was testing.
  pr: 1

