  requirement: REQ-D-14
  data_impact: >-
    Joins are re-issued on every reconnect and nothing closed a rejection gap.
    Measured at 200 collections x 20 reconnects: 4,000 permanently-open gaps,
    a 1.1 MiB manifest, and 89.6 seconds of synchronous read-modify-write-fsync
