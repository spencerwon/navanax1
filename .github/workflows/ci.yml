name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # BUG-20260909-034: v4/v5 target Node 20, which GitHub removes from
      # runners on 2026-09-23. v5/v6 run on Node 24.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}

      # Runs with no third-party deps at all -- it is the floor of correctness
      # and must pass before anything else is attempted.
      # BUG-20260911-078: this step ran BEFORE any install and died with
      # ModuleNotFoundError: yaml, so every step below it was skipped and CI was
      # red on every branch, main included, from 2026-09-09. Tests that genuinely
      # need a dependency now declare it with @needs(...) and are reported as
      # SKIPPED here -- listed by name, counted in their own column, never counted
      # as passed. The strict step after Install is what actually runs them.
      - name: Self-test (stdlib only)
        run: python3 tests/selftest.py

      # Health subsystem (docs/health/03 §2): the same stdlib-first rule. The engine
      # self-test holds the Python port to the JavaScript reference's golden fixture;
      # the knowledge-base self-test runs every contract rule against a planted violation;
      # the errors self-test holds the halt rules of the error hierarchy. One step per
      # module and mode, so a module's removal recipe (docs/health/07) deletes whole
      # steps by name and never edits a shared one.
      - name: Health engine self-test (stdlib only)
        run: python3 tests/health_selftest.py
      - name: Health knowledge-base self-test (stdlib only)
        run: python3 tests/health_kb_selftest.py
      - name: Health errors self-test (stdlib only)
        run: python3 tests/health_errors_selftest.py

      - name: Install
        run: pip install -e ".[dev]"

      # The guard that keeps the skips above honest. With every dependency
      # installed there is no excuse for a skip, so --no-skips turns one into a
      # failure: the 79 tests the stdlib-only step could not run are executed here
      # for real, and a test that quietly stops running cannot disappear.
      - name: Self-test (strict; every skipped test actually runs)
        run: python3 tests/selftest.py --no-skips
      - name: Health engine self-test (strict)
        run: python3 tests/health_selftest.py --no-skips
      - name: Health knowledge-base self-test (strict)
        run: python3 tests/health_kb_selftest.py --no-skips
      - name: Health errors self-test (strict)
        run: python3 tests/health_errors_selftest.py --no-skips

      # HREQ-X-01/X-02: every module's fields, paths, tests, dependency edges and removal
      # recipe hold against the repository, and docs/health/07 is the registry's rendering.
      - name: Health module registry
        run: PYTHONPATH=src python3 -m health.registry --check

      # HREQ-D-03: the knowledge base conforms to its contract and the cross-file rules.
      - name: Health knowledge-base contract (kb-check)
        run: PYTHONPATH=src python3 -m health.cli kb-check

      # HREQ-X-05 / docs/health/03 Appendix B V-08: the committed golden fixture is what
      # the JavaScript reference writes today. Node 22 is the version the fixture was
      # generated with (/opt/node22 on the development machine); setup-node v5 runs on
      # Node 24 (BUG-20260909-034: the v4 actions target Node 20, removed from runners).
      - name: Set up Node 22 (golden fixture)
        uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Health golden fixture up to date
        run: node tools/health_golden.mjs --check

      # BUG-20260909-010: the production codec had ZERO test coverage because
      # the sandbox the code was written in cannot install zstandard. CI can,
      # so CI is where the multi-frame contract is actually proven.
      # Facts first, verdict second: if the gate below goes red, this step
      # says WHY in terms of what the binding actually does (BUG-20260909-032).
      - name: What does this zstandard build actually do?
        run: python3 tools/zstd_probe.py

      - name: Codec multi-frame contract (real zstandard)
        run: |
          python3 - <<'PY'
          import sys, zstandard
          sys.path.insert(0, "src")
          from navanax.codec import ZstdCodec, GzipCodec, verify_codec_roundtrip
          for c in (ZstdCodec(level=3), GzipCodec()):
              verify_codec_roundtrip(c, frames=5)
              print(f"ok {c.name}")
          print("python-zstandard", zstandard.__version__)
          PY

      # A bug marked `fixed` whose regression test does not exist is a claim,
      # not a fix. This is the gate that makes the bug log load-bearing.
      - name: Bug ledger consistency
        run: python3 tools/buglog.py --check
      - name: Lint
        run: ruff check src tests tools   # tools/ was excluded before BUG-20260909-004
      # BUG-20260909-019: `pytest -q` collected ZERO tests and exited 5, so the
      # pipeline could never go green -- and every gate after it, including the
      # bug-ledger check, never ran. tests/selftest.py is the real suite (it
      # runs as step one, with no dependencies at all). pytest is scaffolding
      # for later, so exit code 5 (nothing collected) is tolerated and nothing
      # else is.
      - name: Tests (pytest; exit 5 = nothing collected yet, tolerated)
        run: pytest -q || test $? -eq 5

      # REQ-N-11 / REQ-N-14: standing checks, not one-time reviews.
      # BUG-20260909-033: this was a one-line grep that fired on a 14-character
      # test placeholder the first time it ever ran. The checker knows what a
      # real key looks like, and has its own regression test.
      - name: No credentials in repo (REQ-N-11)
        run: python3 tools/secrets_check.py
      - name: No transaction-signing capability
        run: |
          if grep -rInE '\b(eth_sendRawTransaction|signTransaction|sign_transaction|from_mnemonic|Account\.from_key)\b' \
             --include='*.py' src/ ; then
            echo "::error::transaction-signing capability present (REQ-N-14)"; exit 1
          fi
      # A syntax-tree check (tools/swallow_check.py): the regular expression used until
      # 2026-10-03 flagged nothing on a planted swallow (BUG-20261003-169).
      - name: DataIntegrityError is never swallowed
        run: python3 tools/swallow_check.py --names DataIntegrityError src
      # docs/health/05 §6.1: a surface that cannot render the disclaimer renders
      # "unavailable"; it never swallows the error and shows the number anyway.
      # The same syntax-tree check over every SurfaceIntegrityError subclass, qualified or
      # in a tuple (BUG-20261003-168); tests/health_errors_selftest.py proves it fires.
      - name: SurfaceIntegrityError is never swallowed (health)
        run: PYTHONPATH=src python3 tools/swallow_check.py --family health.errors:SurfaceIntegrityError src/health
